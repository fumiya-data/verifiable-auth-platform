name: e2e

on:
  push:
    paths:
      - "analysis/**"
      - "engine/**"
      - "fixtures/**"
      - "observability/**"
      - "scripts/**"
      - "spec/**"
      - "tests/**"
      - "tui/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "analysis/**"
      - "engine/**"
      - "fixtures/**"
      - "observability/**"
      - "scripts/**"
      - "spec/**"
      - "tests/**"
      - "tui/**"

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang cmake
      - name: Install analysis dependencies
        run: python -m pip install -r analysis/requirements.txt
      - name: Run verification flow
        run: bash scripts/run-e2e.sh
