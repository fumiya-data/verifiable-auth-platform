name: engine

on:
  push:
    paths:
      - "engine/**"
      - "tests/**"
      - "scripts/run-engine-tests.sh"
      - "scripts/run-engine-tests.ps1"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - "tests/**"
      - "scripts/run-engine-tests.sh"
      - "scripts/run-engine-tests.ps1"

jobs:
  c-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang cmake
      - name: Run engine tests
        run: bash scripts/run-engine-tests.sh
      - name: Run engine tests in Release mode
        run: |
          cmake -S engine -B engine/.build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/.build-release
          ctest --test-dir engine/.build-release --output-on-failure
