name: engine

on:
  push:
    paths:
      - "engine/**"
      - "tests/**"
      - "scripts/run-engine-tests.sh"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - "tests/**"
      - "scripts/run-engine-tests.sh"

jobs:
  c-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang cmake
      - name: Run engine tests
        run: bash scripts/run-engine-tests.sh
